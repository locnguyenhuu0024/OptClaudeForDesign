name: Verify rules

on:
  push:
  pull_request:

jobs:
  test-ownership-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON and guard behavior
        run: |
          python -m json.tool .claude/settings.guard.example.json >/dev/null
          python -m unittest discover -s tests -v
